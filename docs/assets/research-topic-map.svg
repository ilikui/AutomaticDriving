<rect x="350" y="150" width="160" height="95" rx="15" fill="#234a72" stroke="#70b7ff"/><text x="430" y="188" fill="#fff" font-size="22" font-weight="700">多传感器融合</text><text x="430" y="218" fill="#d5e8ff" font-size="15">BEV · Alignment</text>
<rect x="610" y="150" width="160" height="95" rx="15" fill="#234a72" stroke="#70b7ff"/><text x="690" y="188" fill="#fff" font-size="22" font-weight="700">定位与地图</text><text x="690" y="218" fill="#d5e8ff" font-size="15">SLAM · GNSS/INS</text>
<rect x="870" y="150" width="160" height="95" rx="15" fill="#234a72" stroke="#70b7ff"/><text x="950" y="188" fill="#fff" font-size="22" font-weight="700">运动预测</text><text x="950" y="218" fill="#d5e8ff" font-size="15">Multi-modal · Risk</text>
<rect x="870" y="330" width="160" height="95" rx="15" fill="#31533f" stroke="#7ad6a0"/><text x="950" y="368" fill="#fff" font-size="22" font-weight="700">规划与决策</text><text x="950" y="398" fill="#dcf7e5" font-size="15">Search · Optimization</text>
<rect x="610" y="330" width="160" height="95" rx="15" fill="#31533f" stroke="#7ad6a0"/><text x="690" y="368" fill="#fff" font-size="22" font-weight="700">控制</text><text x="690" y="398" fill="#dcf7e5" font-size="15">MPC · Tracking</text>
<rect x="350" y="330" width="160" height="95" rx="15" fill="#654a2c" stroke="#ffcc7a"/><text x="430" y="368" fill="#fff" font-size="22" font-weight="700">安全与鲁棒性</text><text x="430" y="398" fill="#ffedcf" font-size="15">OOD · Fault injection</text>
<rect x="80" y="330" width="170" height="95" rx="15" fill="#654a2c" stroke="#ffcc7a"/><text x="165" y="368" fill="#fff" font-size="22" font-weight="700">评测与复现</text><text x="165" y="398" fill="#ffedcf" font-size="15">Metrics · Ablation</text></g>
<path d="M165 425 V510 H1030 V425" stroke="#ffcc7a" stroke-width="2" stroke-dasharray="8 7" fill="none"/><text x="600" y="550" fill="#ffe4b5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700">贯穿所有主题：数据协议 · 可复现基线 · 失效案例 · 计算成本</text><text x="600" y="590" fill="#a9bfd9" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">读论文时记录假设、输入输出、数据划分、指标定义与适用边界</text></svg>