<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">自动驾驶论文研究主题地图</title><desc id="desc">从感知、融合、定位、预测、规划控制到安全验证的研究关系。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c32"/><stop offset="1" stop-color="#182b45"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#83b8ff"/></marker></defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="56" y="62" fill="#f4f7fb" font-size="30" font-family="Arial,sans-serif" font-weight="700">AUTONOMOUS DRIVING · RESEARCH MAP</text><text x="56" y="94" fill="#a9bfd9" font-size="17" font-family="Arial,sans-serif">从子问题到系统证据：主题相互关联，不是唯一固定流水线</text>
<g stroke="#83b8ff" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".9"><path d="M250 200 H350"/><path d="M510 200 H610"/><path d="M770 200 H870"/><path d="M950 245 V330"/><path d="M870 390 H770"/><path d="M610 390 H510"/><path d="M430 245 V330"/><path d="M690 245 V330"/><path d="M510 390 Q600 500 690 390"/></g>
