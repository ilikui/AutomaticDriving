<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">CARLA reproducible simulation loop</title><desc id="d">A simulation workflow connecting environment pinning, scenario configuration, execution, metrics and logs, comparison, and regression cases.</desc>
<rect width="1200" height="360" rx="22" fill="#f8fafc"/><text x="38" y="43" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">CARLA · 可复现仿真验证闭环</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="38" y="104" width="180" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="128" y="138" font-size="17" font-weight="700" fill="#1e40af">固定环境</text><text x="128" y="163" font-size="13" fill="#1e40af">版本 · 地图 · 种子</text>
<rect x="278" y="104" width="180" height="92" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="368" y="138" font-size="17" font-weight="700" fill="#075985">配置场景</text><text x="368" y="163" font-size="13" fill="#075985">车辆 · 传感器 · 交通</text>
<rect x="518" y="104" width="180" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="608" y="138" font-size="17" font-weight="700" fill="#166534">执行仿真</text><text x="608" y="163" font-size="13" fill="#166534">命令 · 日志 · 事件</text>
<rect x="758" y="104" width="180" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="848" y="138" font-size="17" font-weight="700" fill="#92400e">计算指标</text><text x="848" y="163" font-size="13" fill="#92400e">成功率 · TTC · 误差</text>
<rect x="998" y="104" width="164" height="92" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1080" y="138" font-size="17" font-weight="700" fill="#5b21b6">对比与归档</text><text x="1080" y="163" font-size="13" fill="#5b21b6">基线 · 失败用例</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M218 150H274m-8-7 8 7-8 7"/><path d="M458 150H514m-8-7 8 7-8 7"/><path d="M698 150H754m-8-7 8 7-8 7"/><path d="M938 150H994m-8-7 8 7-8 7"/><path d="M1080 196V260H128V202m-7 8 7-8 7 8"/></g>
<text x="600" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">发现回归或异常 → 保留证据 → 修复 → 用同一场景再次验证</text>
<text x="600" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">仿真结果只对已覆盖的场景、模型和假设提供证据，不等同于真实道路安全证明</text>
</svg>