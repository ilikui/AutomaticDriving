<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Driving System Architecture</title>
  <desc id="desc">An educational overview of sensor input, perception, localization, prediction, planning, control, and simulation validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081a2f"/><stop offset="1" stop-color="#102f4a"/></linearGradient>
    <linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
    <style>
      .heading{font:700 30px Arial,sans-serif;fill:#f8fafc}.sub{font:400 16px Arial,sans-serif;fill:#cbd5e1}
      .label{font:700 21px Arial,sans-serif;fill:#fff}.small{font:400 15px Arial,sans-serif;fill:#e2e8f0}
      .box{stroke:#ffffff;stroke-opacity:.18;stroke-width:1.5;rx:18}.line{fill:none;stroke:#93c5fd;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="95" r="190" fill="#38bdf8" opacity=".06"/><circle cx="110" cy="690" r="240" fill="#a78bfa" opacity=".06"/>
  <text x="70" y="70" class="heading">AUTONOMOUS DRIVING · SYSTEM OVERVIEW</text>
  <text x="70" y="103" class="sub">A beginner-friendly view of how data becomes a driving action</text>
  <rect x="70" y="160" width="260" height="470" class="box" fill="#163653"/>
  <text x="200" y="205" text-anchor="middle" class="label">01 · SENSORS</text>
  <text x="200" y="235" text-anchor="middle" class="small">Observe the world</text>
  <g transform="translate(104 270)">
    <rect width="192" height="62" rx="12" fill="url(#sensor)"/><text x="96" y="27" text-anchor="middle" class="label">Camera</text><text x="96" y="48" text-anchor="middle" class="small">Images / video</text>
    <rect y="78" width="192" height="62" rx="12" fill="url(#sensor)"/><text x="96" y="105" text-anchor="middle" class="label">LiDAR / Radar</text><text x="96" y="126" text-anchor="middle" class="small">Distance / velocity</text>
    <rect y="156" width="192" height="62" rx="12" fill="url(#sensor)"/><text x="96" y="183" text-anchor="middle" class="label">GNSS / IMU</text><text x="96" y="204" text-anchor="middle" class="small">Position / motion</text>
  </g>
  <rect x="390" y="160" width="350" height="470" class="box" fill="#123d4a"/>
  <text x="565" y="205" text-anchor="middle" class="label">02 · UNDERSTAND</text>
  <text x="565" y="235" text-anchor="middle" class="small">Build a model of the scene</text>
  <g transform="translate(425 270)">
    <rect width="280" height="72" rx="12" fill="url(#brain)"/><text x="140" y="29" text-anchor="middle" class="label">Perception</text><text x="140" y="52" text-anchor="middle" class="small">What is around the car?</text>
    <rect y="92" width="280" height="72" rx="12" fill="url(#brain)"/><text x="140" y="121" text-anchor="middle" class="label">Localization</text><text x="140" y="144" text-anchor="middle" class="small">Where am I?</text>
    <rect y="184" width="280" height="72" rx="12" fill="url(#brain)"/><text x="140" y="213" text-anchor="middle" class="label">Prediction</text><text x="140" y="236" text-anchor="middle" class="small">What may happen next?</text>
  </g>
  <rect x="800" y="160" width="250" height="210" class="box" fill="#332754"/>
  <text x="925" y="205" text-anchor="middle" class="label">03 · PLAN</text><text x="925" y="237" text-anchor="middle" class="small">Choose a safe route</text>
  <text x="925" y="278" text-anchor="middle" class="small">Behavior decision</text><text x="925" y="305" text-anchor="middle" class="small">Path &amp; trajectory</text><text x="925" y="332" text-anchor="middle" class="small">Constraints &amp; costs</text>
  <rect x="1110" y="160" width="220" height="210" class="box" fill="#42265d"/>
  <text x="1220" y="205" text-anchor="middle" class="label">04 · CONTROL</text><text x="1220" y="237" text-anchor="middle" class="small">Follow the trajectory</text>
  <g transform="translate(1152 267)" fill="none" stroke="#d8b4fe" stroke-width="4"><path d="M10 48 L20 10 L130 10 L140 48"/><rect x="0" y="38" width="150" height="45" rx="10"/><circle cx="30" cy="87" r="12" fill="#d8b4fe"/><circle cx="120" cy="87" r="12" fill="#d8b4fe"/></g>
  <path d="M330 395 L380 395" class="line"/><path d="M740 395 L790 395" class="line"/><path d="M1050 265 L1100 265" class="line"/>
  <rect x="390" y="665" width="660" height="55" rx="16" fill="#164e63" stroke="#67e8f9" stroke-opacity=".5"/>
  <text x="720" y="699" text-anchor="middle" class="label">05 · SIMULATE · TEST · MEASURE · IMPROVE</text>
  <path d="M1220 370 L1220 640 L1055 692" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M390 692 L200 692 L200 640" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="70" y="738" class="sub">Learning illustration only · Real systems differ by architecture and implementation</text>
</svg>