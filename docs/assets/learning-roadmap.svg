<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
<title id="t">Autonomous driving learning roadmap</title><desc id="d">A progression from foundations to robotics, vehicle control, sensing, perception, planning, simulation, and engineering validation.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
<rect width="1200" height="350" rx="22" fill="url(#b)"/>
<text x="42" y="45" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">LEARNING ROADMAP</text>
<text x="42" y="78" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">从基础原理走向系统验证</text>
<path d="M95 160H1100" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><circle cx="105" cy="160" r="24" fill="#0ea5e9" stroke="#bae6fd" stroke-width="3"/><text x="105" y="167" fill="#fff" font-size="17" font-weight="700">01</text><text x="105" y="211" fill="#f8fafc" font-size="16" font-weight="700">基础能力</text><text x="105" y="236" fill="#cbd5e1" font-size="12">数学 · Python · C++</text></g>
<g><circle cx="265" cy="160" r="24" fill="#0284c7" stroke="#bae6fd" stroke-width="3"/><text x="265" y="167" fill="#fff" font-size="17" font-weight="700">02</text><text x="265" y="211" fill="#f8fafc" font-size="16" font-weight="700">机器人系统</text><text x="265" y="236" fill="#cbd5e1" font-size="12">ROS 2 · TF · QoS</text></g>
<g><circle cx="425" cy="160" r="24" fill="#0d9488" stroke="#99f6e4" stroke-width="3"/><text x="425" y="167" fill="#fff" font-size="17" font-weight="700">03</text><text x="425" y="211" fill="#f8fafc" font-size="16" font-weight="700">车辆与控制</text><text x="425" y="236" fill="#cbd5e1" font-size="12">运动学 · MPC · 跟踪</text></g>
<g><circle cx="585" cy="160" r="24" fill="#16a34a" stroke="#bbf7d0" stroke-width="3"/><text x="585" y="167" fill="#fff" font-size="17" font-weight="700">04</text><text x="585" y="211" fill="#f8fafc" font-size="16" font-weight="700">感知与定位</text><text x="585" y="236" fill="#cbd5e1" font-size="12">相机 · LiDAR · 融合</text></g>
<g><circle cx="745" cy="160" r="24" fill="#ca8a04" stroke="#fef08a" stroke-width="3"/><text x="745" y="167" fill="#fff" font-size="17" font-weight="700">05</text><text x="745" y="211" fill="#f8fafc" font-size="16" font-weight="700">预测与规划</text><text x="745" y="236" fill="#cbd5e1" font-size="12">轨迹 · 决策 · 约束</text></g>
<g><circle cx="905" cy="160" r="24" fill="#ea580c" stroke="#fed7aa" stroke-width="3"/><text x="905" y="167" fill="#fff" font-size="17" font-weight="700">06</text><text x="905" y="211" fill="#f8fafc" font-size="16" font-weight="700">仿真与开源栈</text><text x="905" y="236" fill="#cbd5e1" font-size="12">CARLA · Autoware</text></g>
<g><circle cx="1065" cy="160" r="24" fill="#7c3aed" stroke="#ddd6fe" stroke-width="3"/><text x="1065" y="167" fill="#fff" font-size="17" font-weight="700">07</text><text x="1065" y="211" fill="#f8fafc" font-size="16" font-weight="700">工程验证</text><text x="1065" y="236" fill="#cbd5e1" font-size="12">测试 · 安全 · 回归</text></g>
</g>
<text x="42" y="306" fill="#bae6fd" font-family="Arial,sans-serif" font-size="14">每一阶段都应留下：可运行代码、实验记录、失败分析与关联知识卡片</text>
