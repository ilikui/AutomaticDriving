<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">自动驾驶数据集选择决策图</title><desc id="desc">根据研究任务选择数据集，随后核验许可、任务版本、数据划分和评测协议。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c32"/><stop offset="1" stop-color="#182b45"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#83b8ff"/></marker></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<text x="56" y="62" fill="#f4f7fb" font-size="30" font-family="Arial,sans-serif" font-weight="700">DATASET SELECTION GUIDE</text><text x="56" y="94" fill="#a9bfd9" font-size="17" font-family="Arial,sans-serif">先定义任务与评价问题，再选数据；数据集名称本身不是能力保证</text>
<g stroke="#83b8ff" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M600 180 V220"/><path d="M600 285 V325 H170 V365"/><path d="M600 325 H455 V365"/><path d="M600 325 H745 V365"/><path d="M600 325 H1030 V365"/><path d="M170 435 V480"/><path d="M455 435 V480"/><path d="M745 435 V480"/><path d="M1030 435 V480"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="390" y="125" width="420" height="55" rx="14" fill="#234a72" stroke="#70b7ff"/><text x="600" y="160" fill="#fff" font-size="22" font-weight="700">研究任务是什么？</text>
<rect x="390" y="220" width="420" height="65" rx="14" fill="#234a72" stroke="#70b7ff"/><text x="600" y="247" fill="#fff" font-size="20" font-weight="700">明确输入、输出与评测问题</text><text x="600" y="270" fill="#d5e8ff" font-size="14">离线指标 / 轨迹预测 / 闭环行为</text>
<rect x="65" y="365" width="210" height="70" rx="14" fill="#31533f" stroke="#7ad6a0"/><text x="170" y="393" fill="#fff" font-size="19" font-weight="700">感知与跟踪</text><text x="170" y="418" fill="#dcf7e5" font-size="15">KITTI · nuScenes · Waymo</text>
<rect x="350" y="365" width="210" height="70" rx="14" fill="#31533f" stroke="#7ad6a0"/><text x="455" y="393" fill="#fff" font-size="19" font-weight="700">预测与地图</text><text x="455" y="418" fill="#dcf7e5" font-size="15">Argoverse · nuScenes</text>
<rect x="640" y="365" width="210" height="70" rx="14" fill="#31533f" stroke="#7ad6a0"/><text x="745" y="393" fill="#fff" font-size="19" font-weight="700">车路协同</text><text x="745" y="418" fill="#dcf7e5" font-size="15">DAIR-V2X</text>
<rect x="925" y="365" width="210" height="70" rx="14" fill="#31533f" stroke="#7ad6a0"/><text x="1030" y="393" fill="#fff" font-size="19" font-weight="700">规划与闭环</text><text x="1030" y="418" fill="#dcf7e5" font-size="15">nuPlan · CommonRoad · CARLA</text>
<rect x="65" y="480" width="210" height="70" rx="14" fill="#654a2c" stroke="#ffcc7a"/><rect x="350" y="480" width="210" height="70" rx="14" fill="#654a2c" stroke="#ffcc7a"/><rect x="640" y="480" width="210" height="70" rx="14" fill="#654a2c" stroke="#ffcc7a"/><rect x="925" y="480" width="210" height="70" rx="14" fill="#654a2c" stroke="#ffcc7a"/>
<text x="170" y="509" fill="#fff" font-size="17" font-weight="700">按官方协议算指标</text><text x="170" y="533" fill="#ffedcf" font-size="14">阈值 · 距离 · 类别</text><text x="455" y="509" fill="#fff" font-size="17" font-weight="700">检查真值定义</text><text x="455" y="533" fill="#ffedcf" font-size="14">历史窗口 · 地图输入</text><text x="745" y="509" fill="#fff" font-size="17" font-weight="700">检查对齐假设</text><text x="745" y="533" fill="#ffedcf" font-size="14">外参 · 时钟 · 通信</text><text x="1030" y="509" fill="#fff" font-size="17" font-weight="700">设计闭环场景</text><text x="1030" y="533" fill="#ffedcf" font-size="14">碰撞 · 完成率 · 舒适性</text></g>
<rect x="95" y="600" width="1010" height="65" rx="14" fill="#25364d" stroke="#8aa4c3"/><text x="600" y="626" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">最终核验清单：许可证与访问条件 · 数据版本与 split · SDK/评测脚本 · 硬件与运行条件</text><text x="600" y="649" fill="#c2d2e5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">离线排行榜不能替代闭环验证；跨数据集结果不应直接等同比较</text></svg>