    <rect x="388" y="300" width="142" height="42" rx="21" fill="#0b3d56" stroke="#38bdf8"/><text x="459" y="326" text-anchor="middle" fill="#bff5ff">CONTROL</text>
    <rect x="544" y="300" width="142" height="42" rx="21" fill="#0b3d56" stroke="#38bdf8"/><text x="615" y="326" text-anchor="middle" fill="#bff5ff">SIMULATION</text>
  </g>
