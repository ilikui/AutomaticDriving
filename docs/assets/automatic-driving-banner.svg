    <path d="M245 126 L160 92 L90 92" fill="none" stroke="#67e8f9" stroke-width="2"/><text x="90" y="80" fill="#a5f3fc" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">SENSOR FUSION</text>
