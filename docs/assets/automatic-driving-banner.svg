<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">AutomaticDriving — Explore Autonomous Driving</title>
  <desc id="desc">A redesigned high-contrast banner showing an autonomous vehicle on a digital road with perception, planning, control, and simulation signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#102c4b"/><stop offset="1" stop-color="#183b55"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8bdcff" stroke-opacity=".10"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="440" rx="28" fill="url(#bg)"/><rect width="1600" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1330" cy="110" r="230" fill="#0ea5e9" opacity=".10"/><circle cx="1110" cy="360" r="180" fill="#8b5cf6" opacity=".10"/>
  <text x="76" y="78" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="5">OPEN LEARNING · ENGINEERING · EXPERIMENTS</text>
  <text x="72" y="157" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800">AUTONOMOUS</text><text x="72" y="220" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800">DRIVING <tspan fill="#67e8f9">LAB</tspan></text>
  <text x="76" y="263" fill="#c7d9eb" font-family="Arial,Helvetica,sans-serif" font-size="21">从原理到开源工程，从算法到可复现实验</text>
