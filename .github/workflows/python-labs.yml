name: Python Autonomous Driving Labs

on:
  push:
    branches: [main]
    paths:
      - "labs/python/**"
      - ".github/workflows/python-labs.yml"
  pull_request:
    paths:
      - "labs/python/**"
      - ".github/workflows/python-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show Python version
        run: python --version
      - name: Run unit tests
        run: python -m unittest discover -s labs/python -p 'test_*.py' -v
      - name: Smoke-test experiment scripts
        run: |
          python labs/python/kalman_1d.py
          python labs/python/coordinate_transform_2d.py
          python labs/python/sensor_fusion_1d.py
          python labs/python/sensor_fusion_robust.py
          python labs/python/sensor_fusion_timing_covariance.py
          python labs/python/pure_pursuit.py
          python labs/python/pure_pursuit_sweep.py
          python labs/python/iou_nms.py
